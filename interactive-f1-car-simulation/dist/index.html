:"4 flaps"},{k:"Span",v:"1.90 m"},{k:"Downforce share",v:"≈ 25 %"},{k:"Material",v:"Carbon fibre"}],fact:"A front wing is tuned in steps of 0.5° at the flap. One degree is worth about 1.5 % of total front-axle grip."},{id:"sidepods",n:"02",name:"Sidepods & Engine Cover",phase:"skin",tagline:"Packaging, cooling and aero sculpture in one.",body:"The sidepods swallow air for the radiators, then the undercut and the tapering 'coke bottle' rear feed fast air toward the diffuser. The engine cover and airbox feed the turbo and stretch to the rear wing.",stats:[{k:"Inlet area",v:"≈ 0.07 m² each"},{k:"Airbox flow",v:"≈ 0.6 kg/s"},{k:"Mirrors",v:"Aero-shaped"},{k:"Skin",v:"Painted carbon"}],fact:"At speed the airbox swallows roughly half a cubic metre of air every second, and the turbo compresses all of it."},{id:"rearwing",n:"03",name:"Rear Wing, Beam Wing & DRS",phase:"skin",tagline:"Downforce on demand, drag on demand.",body:"A two-element main wing works with a lower beam wing and the diffuser as one system. On a straight, the driver presses a button and the top flap lifts, which opens the slot and cuts drag by up to a third.",stats:[{k:"DRS flap gap",v:"10 – 85 mm"},{k:"Drag saved",v:"≈ 25 – 35 %"},{k:"Max height",v:"0.95 m"},{k:"Activation",v:"Hydraulic"}],fact:"DRS can add 10–15 km/h of top speed, enough to overtake when the car ahead is within one second."},{id:"tyres",n:"04",name:"Wheels & Tyres",phase:"skin",tagline:"Four hands' worth of rubber on the road.",body:"Each contact patch is about the size of a postcard. The tyres supply all the grip, but they are also the dirtiest part of the car aerodynamically, since they account for roughly 40 % of total drag. Wheel covers and rim slots help manage the wake.",stats:[{k:"Diameter",v:"720 mm"},{k:"Width F / R",v:"305 / 405 mm"},{k:"Operating temp",v:"90 – 110 °C"},{k:"Drag share",v:"≈ 35 – 40 %"}],fact:"At 300 km/h the tyres spin at roughly 2,200 rpm, and the tread is pulled outward with nearly 2,000 g of centrifugal acceleration."},{id:"powerunit",n:"05",name:"Power Unit",phase:"muscle",tagline:"1.6 litres. Over 1,000 horsepower.",body:"A 90° V6 turbo-hybrid that turns fuel into work with over 50 % thermal efficiency, about twice that of a road car. The turbo's MGU-H recovers exhaust heat; the MGU-K recovers braking energy and adds up to 120 kW on demand.",stats:[{k:"Displacement",v:"1.6 L V6 turbo"},{k:"Max revs",v:"15,000 rpm"},{k:"Thermal eff.",v:"> 50 %"},{k:"Output",v:"≈ 1,000 hp"}],fact:"At 15,000 rpm every piston goes up and down 250 times a second, and each stroke lasts only a few thousandths of a second."},{id:"energystore",n:"06",name:"Energy Store & ERS",phase:"muscle",tagline:"A lap's worth of lightning in a box.",body:"The lithium-ion battery sits low behind the driver to keep the centre of gravity down. It is charged by the MGU-K under braking and by the MGU-H under acceleration, then delivers up to 4 MJ each lap back to the wheels.",stats:[{k:"Max deploy / lap",v:"4 MJ"},{k:"Voltage",v:"≈ 800 V"},{k:"Mass",v:"≥ 20 kg"},{k:"Cooling",v:"Liquid + air"}],fact:"4 MJ is enough energy to boil about 12 litres of water, released in under a minute of a lap."},{id:"gearbox",n:"07",name:"Gearbox & Differential",phase:"muscle",tagline:"Eight gears, shifted in a blink.",body:"A carbon-titanium cased, 8-speed seamless-shift transmission. Two gears are engaged for a moment during a shift so torque never stops flowing. The casing is also a structural member, carrying the rear suspension loads.",stats:[{k:"Gears",v:"8 + reverse"},{k:"Shift time",v:"< 20 ms"},{k:"Casing",v:"Carbon / Ti"},{k:"Must last",v:"6 race weekends"}],fact:"A gearshift takes less time than the flap of an eyelash. A driver will change gear around 3,000 times a race."},{id:"cooling",n:"08",name:"Cooling Radiators",phase:"muscle",tagline:"Managing 1,500 kW of waste heat.",body:"Radiators for water, oil and the charge air sit in the sidepods. A large opening keeps the engine safe but costs drag, so teams constantly trade reliability against speed. In hot races the louvres are opened wide.",stats:[{k:"Water temp",v:"≈ 105 °C"},{k:"Oil temp",v:"≈ 120 °C"},{k:"Heat rejected",v:"≈ 500 kW"},{k:"Drag cost",v:"up to 8 %"}],fact:"500 kW of waste heat is about the same as 250 household kettles boiling at the same time, all hidden in two sidepods."},{id:"fuelcell",n:"09",name:"Fuel Cell",phase:"muscle",tagline:"A rubber bladder inside the carbon.",body:"Up to 110 kg of fuel sits in a puncture-proof, foam-filled flexible bladder just behind the driver, inside the survival cell. As the race progresses the car gets lighter by nearly 10 %, which is worth around three tenths of a second per lap.",stats:[{k:"Max fuel",v:"110 kg"},{k:"Flow limit",v:"100 kg/h"},{k:"Fuel",v:"E10 / sustainable"},{k:"Bladder",v:"Kevlar-reinforced"}],fact:"An F1 car burns about 1 kg of fuel every 3.5 km, roughly 1 litre every 2 km."},{id:"brakes",n:"10",name:"Brakes",phase:"muscle",tagline:"From 300 km/h to 80 in under 2 seconds.",body:"Carbon-carbon discs only work above about 400 °C and glow up to 1,000 °C. Brake ducts feed cooling air through 1,000+ drilled holes. Under braking a driver feels around 5–6 g, and the rear brakes also work as an energy-recovery generator.",stats:[{k:"Disc diameter",v:"≈ 330 mm"},{k:"Peak temp",v:"1,000 °C"},{k:"Decel.",v:"5 – 6 g"},{k:"Pedal force",v:"≈ 160 kg"}],fact:"A driver can stop from 200 km/h in about the length of a football pitch, in about 2 seconds."},{id:"cockpit",n:"11",name:"Driver & Steering Wheel",phase:"muscle",tagline:"The most important actuator.",body:"The driver is the highest-mass component in the cockpit, lying almost horizontally. The steering wheel is the car's control centre: 25+ buttons and rotaries adjust brake balance, differential, engine modes and ERS deployment while cornering at 5 g.",stats:[{k:"Wheel controls",v:"25+"},{k:"Cockpit temp",v:"≈ 50 °C"},{k:"Driver weight loss",v:"≈ 2 – 3 kg / race"},{k:"Peak lateral",v:"5 – 6 g"}],fact:"A driver's hear , and a sensitive heart.",body:"Double wishbones hold the wheel, and a push-rod transfers load to a rocker, torsion bar and damper inside the nose. The arms are aerodynamically shaped as they sit in the wake of the front wing, and every millimetre of geometry is tuned for tyre contact.",stats:[{k:"Layout",v:"Push-rod"},{k:"Arms",v:"Carbon fibre"},{k:"Wheel travel",v:"< 50 mm"},{k:"Load / corner",v:"> 1 tonne"}],fact:"F1 suspension is stiff: wheel travel is only a few centimetres, because the floor works best at a constant height."},{id:"rearsusp",n:"16",name:"Rear Suspension",phase:"skeleton",tagline:"Pull-rod for a clean airflow to the diffuser.",body:"Mounted to the gearbox casing, the rear wishbones and pull-rod keep the suspension low so it does not interfere with the airflow running to the rear wing. The driveshafts pass through and power the rear wheels.",stats:[{k:"Layout",v:"Pull-rod"},{k:"Wheel travel",v:"< 60 mm"},{k:"Toe link",v:"Adjustable"},{k:"Driveshaft",v:"Ti / carbon"}],fact:"A modern F1 car can corner at about 6.5 g. That's more than a fighter jet pilot experiences in a dogfight."}];function U1(s){var t,n,a="";if(typeof s=="string"||typeof s=="number")a+=s;else if(typeof s=="object")if(Array.isArray(s)){var o=s.length;for(t=0;t<o;t++)s[t]&&(n=U1(s[t]))&&(a&&(a+=" "),a+=n)}else for(n in s)s[n]&&(a&&(a+=" "),a+=n);return a}function rC(){for(var s,t,n=0,a="",o=arguments.length;n<o;n++)(s=arguments[n])&&(t=U1(s))&&(a&&(a+=" "),a+=t);return a}const oC=(s,t)=>{const n=new Array(s.length+t.length);for(let a=0;a<s.length;a++)n[a]=s[a];for(let a=0;a<t.length;a++)n[s.length+a]=t[a];return n},lC=(s,t)=>({classGroupId:s,validator:t}),P1=(s=new Map,t=null,n)=>({nextPart:s,validators:t,classGroupId:n}),Uf="-",by=[],cC="arbitrary..",uC=s=>{const t=hC(s),{conflictingClassGroups:n,conflictingClassGroupModifiers:a}=s;return{getClassGroupId:u=>{if(u.startsWith("[")&&u.endsWith("]"))return fC(u);const f=u.split(Uf),h=f[0]===""&&f.length>1?1:0;return O1(f,h,t)},getConf
