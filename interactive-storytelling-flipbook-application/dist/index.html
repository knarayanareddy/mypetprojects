at War`,sub:"1939 – 1945",blurb:"Six years that shook the planet, from broken peace to a fragile new beginning.",cloth:"#3b4a3f",gold:"#dcc58f",ink:"#2b2926",pal:["#8d9a7b","#c0614a","#6f8796","#d8b765","#a7a9a0"],emblem:"helmet",parts:[[1,"The Road to War"],[9,"The Storm Breaks"],[18,"The War Widens"],[28,"The Tide Turns"],[37,"Victory in Europe"],[47,"The End of the War"]],pages:[["1939 – 1945","The World at War","Six years, more than thirty countries and a planet changed forever. Turn these pages to follow the story from a broken peace to a fragile new beginning.","globe stars"],["1919","A Peace That Did Not Hold","The Treaty of Versailles ended the Great War but left Germany humiliated and in debt. Resentment, poverty and old rivalries became fuel for something worse.","scroll clouds"],["1929","The Great Depression","Banks failed and jobs vanished across the world. Desperate people listened to loud promises, and extremist movements rose in Europe and Asia.","skyline clouds"],["1933","Hitler Takes Power","Adolf Hitler became Chancellor of Germany and swiftly dismantled democracy. The Nazi state began rearming, censoring and persecuting its own citizens.","flag clouds"],["1931 – 1937","Japan Moves on China","Japan seized Manchuria and then launched a full invasion of China. The Nanjing massacre of 1937 showed how brutal the coming war would be.","map mountains"],["1935 – 1936","Fascist Ambitions","Mussolini's Italy invaded Ethiopia while Germany marched into the Rhineland. The League of Nations protested, but nobody stopped them.","tank ground"],["1938","Appeasement at Munich","Britain and France let Germany take the Sudetenland, hoping to keep the peace. 'Peace for our time,' said Chamberlain. It lasted less than a year.","letter dove"],["August 1939","A Pact of Enemies","Germany and the Soviet Union signed a non-aggression pact and secretly agreed to divide Poland. The last obstacle to war had vanished.","scroll moon stars"],["1 September 1939","Poland Invaded","German forces crossed the border at dawn. Britain and France declared war two days later, and the Second World War began.","tank plane clouds"],["1939 – 1940","Blitzkrieg","Tanks, dive-bombers and motorised infantry struck together with stunning speed. Poland fell in five weeks, and the world learned a new word: lightning war.","tank plane ground"],["April – June 1940","The Fall of France","Germany swept through the Netherlands and Belgium, then around the Maginot Line. Paris fell on 14 June, and France surrendered days later.","gate skyline smoke"],["May – June 1940","Miracle at Dunkirk","Destroyers, fishing boats and pleasure yachts crossed the Channel. More than 330,000 soldiers were carried home from the beaches.","boat waves clouds"],["1940","Churchill Stands Alone","Winston Churchill became prime minister, promising nothing but blood, toil, tears and sweat. Britain refused to bargain with Hitler.","flag clouds sun"],["July – October 1940","Battle of Britain","Spitfires and Hurricanes rose to meet the Luftwaffe over southern England. 'Never was so much owed by so many to so few.'","plane clouds sun"],["1940 – 1941","The Blitz","Night after night bombs fell on London, Coventry and Liverpool. Families slept in Underground stations, and the cities kept their nerve.","skyline smoke moon"],["September 1940","The Axis Unites","Germany, Italy and Japan signed the Tripartite Pact. The Axis would fight the Allies across Europe, Africa, Asia and the oceans.","shield stars"],["1940 – 1943","War in the Desert","Rommel's Afrika Korps and Montgomery's Eighth Army fought back and forth across Libya and Egypt. The turning point came at El Alamein in 1942.","tank camel sun"],["June 1941","Operation Barbarossa","Germany invaded the Soviet Union along a front nearly 3,000 kilometres long, the largest invasion in history. Millions of soldiers crossed the frontier.","tank forest smoke"],["Winter 1941","The Winter Stops Them","Snow and mud halted the Germans at the gates of Moscow. Fresh Soviet divisions from Siberia counter-attacked in bitter cold.","helmet stars hills"],["August 1941","The Atlantic Charter","Roosevelt and Churchill met aboard warships off Newfoundland and pledged freedom, self-determination and peace after victory.","ship waves clouds"],["1939 – 1945","Battle of the Atlantic","German U-boats hunted Allied convoys carrying food, fuel and troops. The longest campaign of the war decided whether Britain could survive.","sub waves moon"],["7 December 1941","Pearl Harbor","Japanese carrier aircraft struck the US fleet in Hawaii at dawn. The next day America declared war, and the conflict became truly global.","plane ship smoke"],["1941 – 1942","Japan Sweeps Asia","Within months Japan took Hong Kong, Malaya, Singapore, the Philippines and Burma. The fall of Singapore was Britain's worst military defeat.","map palm sun"],["1941 – 1945","The Holocaust","Nazi Germany murdered six million Jews and millions of others in ghettos, camps and killing fields. It stands as history's darkest warning.","candle stars"],["June 1942","Midway","American codebreakers knew where Japan would strike. Four Japanese carriers sank in a single day, and the Pacific tide turned.","plane ship waves"],["1942 – 1943","Stalingrad","Street by street, house by house, Soviet defenders ground down the German Sixth Army. Its surrender in February 1943 broke the Wehrmacht's spell.","helmet skyline smoke"],["1939 – 1945","The Codebreakers","At Bletchley Park, Alan Turing and thousands of colleagues cracked Enigma. Historians believe their work shortened the war by years.","gears letter"],["November 1942","Operation Torch","Allied troops landed in Morocco and Algeria, opening a new front in North Africa and squeezing Rommel from both sides.","ship palm waves"],["July 1943","Invasion of Sicily","Allied armies took Sicily in five weeks. Mussolini fell from power, and Italy soon changed sides.","tank mountains sun"],["July 1943","Kursk","The largest tank battle in history ended in German defeat. From now on, the Red Army advanced westward.","tank smoke ground"],["1942 – 1945","Women at War","Women built bombers, ran farms, broke codes, nursed the wounded and flew aircraft. 'Rosie the Riveter' became a symbol of a workforce reborn.","gears heart"],["1942 – 1945","Resistance","Partisans and underground networks sabotaged railways, hid families and smuggled pilots to safety across occupied Europe.","letter moon stars"],["March – July 1944","The Burma Front","Indian, British, African and Gurkha soldiers halted Japan at Kohima and Imphal in north-east India. It was the turning point in Asia.","helmet forest mountains"],["1943 – 1945","Island Hopping","American and Allied forces leapt from island to island across the Pacific, from Guadalcanal to Iwo Jima, pushing Japan's perimeter back.","palm boat waves"],["1944","Bombing the Reich","Day and night, bomber fleets struck factories, railways and cities. The campaign cost thousands of airmen and countless civilian lives.","plane clouds moon"],["November 1943","The Big Three","Roosevelt, Churchill and Stalin met at Tehran to plan the final campaigns. Yalta and Potsdam would follow.","map stars"],["6 June 1944","D-Day","More than 150,000 troops landed on five Normandy beaches, backed by thousands of ships and aircraft. It was the largest seaborne invasion ever.","ship boat waves"],["June – August 1944","The Normandy Breakout","Fighting through the sunken lanes and hedgerows was slow and brutal. By August the Allies had broken out and raced toward Paris.","tank tree ground"],["25 August 1944","Paris Liberated","French and Allied soldiers entered Paris as church bells rang. After four years of occupation, the city was free.","skyline flag sun"],["June 1944","Operation Bagration","The Red Army smashed Germany's Army Group Centre in Belarus, advancing hundreds of kilometres in a few weeks.","tank forest smoke"],["September 1944","A Bridge Too Far","Operation Market Garden dropped paratroopers into the Netherlands to seize bridges. The last, at Arnhem, could not be held.","parachute bridge clouds"],["December 1944","Battle of the Bulge","Germany's last offensive in the Ardennes surprised American troops in snow and fog. Bastogne held, and the gamble failed.","helmet forest stars"],["1944 – 1945","Liberating the Camps","Soviet and Western troops opened Auschwitz, Buchenwald, Belsen and others, finding survivors and evidence the world could not ignore.","candle moon"],["February 1945","Yalta","The Allied leaders planned the post-war order: occupation zones in Germany, free elections in Europe and a new United Nations.","globe scroll"],["April – May 1945","The Fall of Berlin","Soviet armies fought into the ruined capital. Hitler died by suicide on 30 April, and Berlin surrendered on 2 May.","skyline smoke flag"],["8 May 1945","Victory in Europe","Germany surrendered unconditionally. Crowds filled the streets of London, Paris, New York and Moscow to celebrate.","flag rays stars"],["February – June 1945","Iwo Jima and Okinawa","Fierce battles on tiny islands cost tens of thousands of lives. Everyone feared an invasion of Japan itself would be even worse.","flag mountains smoke"],["6 and 9 August 1945","Hiroshima and Nagasaki","Two atomic bombs destroyed two Japanese cities and killed well over a hundred thousand people. The nuclear age had begun.","mushroom clouds"],["15 August 1945","Japan Surrenders","Emperor Hirohito announced the surrender by radio. The formal signing took place aboard the USS Missouri on 2 September.","radio ship waves"],["1945 – 1946","The Nuremberg Trials","Nazi leaders faced judges for crimes against humanity. The trials created principles of international law still used today.","scales scroll"],["October 1945","The United Nations","Fifty nations signed the UN Charter in San Francisco, hoping that talk would replace war.","globe dove olive"],["Remembering","Never Again","An estimated 70 to 85 million people died. We remember them by telling their stories, and by choosing peace each day.","candle dove stars"]]},km={id:"mahabharata",title:`The
Mahabharata`,sub:"The Great Epic of Bharata",blurb:"A family divided, a war for dharma, and a song sung on a battlefield.",cloth:"#7b1f24",gold:"#e8be68",ink:"#2e1d1a",pal:["#e08a2e","#b8332e","#3f4f8f","#d9a93c","#7a3b6b"],emblem:"chariot",parts:[[1,"Origins"],[11,"Rivals Rise"],[21,"The Dice Game"],[28,"Exile"],[35,"The Road to War"],[41,"Kurukshetra"],[49,"Aftermath"]],pages:[["Prologue","The Great Epic of Bharata","Composed by the sage Vyasa, the Mahabharata is among the longest poems ever written. It tells of duty, family, war and one question: what is dharma?","book lotus"],["Ancestors","Shantanu and Ganga","King Shantanu married the river goddess Ganga on one condition: he must never question her. Their eighth son, Devavrata, would become the great Bhishma.","drop crown waves"],["The Vow","Bhishma's Terrible Promise","So that his father could marry Satyavati, Devavrata vowed to give up the throne and never marry. The gods rained flowers and named him Bhishma, 'the terrible'.","crown sun"],["Dynasty","Vyasa and the Heirs","After Shantanu's line faltered, Vyasa fathered Dhritarashtra, Pandu and Vidura. Dhritarashtra was born blind, so Pandu took the throne.","sage tree"],["The Curse","Pandu's Curse","Pandu accidentally killed a sage disguised as a deer, and was cursed to die if he ever embraced his wives. He retired to the forest.","deer forest moon"],["The Boon","Kunti's Mantra","Kunti knew a mantra that could call any god. Through it she bore Yudhishthira, Bhima and Arjuna; Madri bore the twins Nakula and Sahadeva.","sunburst lotus"],["The Secret","The Child Named Karna","As a girl Kunti tried the mantra and called the Sun. Her child Karna was set afloat in a basket and raised by a charioteer.","boat waves sun"],["The Hundred","The Kauravas Are Born","Gandhari, who blindfolded herself for life, bore a hundred sons and a daughter. The eldest, Duryodhana, was born amid ill omens.","people crown"],["Youth","Princes of Hastinapura","Bhima's strength and Arjuna's aim stirred Duryodhana's envy. The rivalry between cousins grew with every lesson and every game.","mace bow"],["The Teacher","Drona's Academy","Drona taught the princes archery. When he asked them to hit a bird's eye, only Arjuna answered: 'I see only the eye.'","bow bird tree"],["Tournament","Karna Appears","At the tournament Karna matched Arjuna's feats. Mocked for his birth, he was crowned king of Anga by Duryodhana, who won a loyal friend.","crown chariot sun"],["A Gift","Ekalavya's Thumb","A forest boy taught himself archery before a clay statue of Drona. Asked for his thumb as a teacher's fee, he gave it without a word.","bow forest"],["The Plot","The House of Lac","Duryodhana built a palace of flammable lac for the Pandavas. Warned by Vidura, they escaped through a tunnel as it burned.","fire fort"],["Exile","Into the Forest","Disguised as Brahmins, the Pandavas wandered forests and villages. Bhima slew the demon Hidimba and married his sister.","people tree forest"],["The Slayer","Bhima and Baka","A demon demanded a villager and a cartload of food every week. Bhima ate the feast himself and defeated the demon to free the village.","mace hut"],["The Contest","Draupadi's Swayamvara","King Drupada's daughter would marry whoever strung a mighty bow and hit a spinning fish through its reflection. Arjuna alone succeeded.","bow fish"],["The Union","Five Husbands, One Queen","Kunti told her sons to share whatever they had brought home, not knowing it was a bride. Draupadi became wife to all five Pandavas.","people lotus"],["The Partition","Indraprastha Rises","Dhritarashtra gave the Pandavas a wasteland. With Krishna's help they built the glittering city of Indraprastha.","fort sun"],["A Friend","Krishna Arrives","Krishna, prince of Dwarka and Kunti's nephew, became the Pandavas' friend, guide and charioteer. He plays the flute, and he plays the game of fate.","flute feather"],["Glory","The Rajasuya","Yudhishthira's imperial sacrifice made him emperor of the world. Kings brought tribute, but Duryodhana burned with jealousy.","throne crown"],["The Palace","The Palace of Illusions","The Pandava palace was so magical that Duryodhana mistook marble for water and water for marble. Draupadi's laughter became a fatal insult.","dome waves"],["The Scheme","Shakuni's Challenge","Shakuni, Duryodhana's uncle, invited Yudhishthira to a game of dice. The dice were loaded, and Yudhishthira could not refuse a challenge.","dice"],["The Loss","Everything Wagered","Yudhishthira lost his treasure, his kingdom, his brothers, himself and finally Draupadi. Every stake made the next seem safer.","dice throne"],["The Shame","The Sari That Never Ended","Draupadi was dragged into the hall and insulted. She cried out for justice, and Krishna answered: her sari never ran out.","diamond lotus"],["The Vows","Oaths of Vengeance","Bhima vowed to break Duryodhana's thigh; Arjuna swore to slay Karna. Draupadi left her hair unbound until the insult was avenged.","mace fire"],["Reprieve","Dhritarashtra Relents","Frightened by omens, the blind king restored the Pandavas' freedom. But Duryodhana soon tricked them into a second game.","dice scroll"],["The Terms","Thirteen Years Away","The loser must spend twelve years in the forest and live unrecognised in the thirteenth. The Pandavas set off with Draupadi.","road forest"],["The Forest","Twelve Years in the Woods","Sages told stories beside their fires, among them those of Nala and Damayanti and of Savitri. The Pandavas learned patience.","fire tree moon"],["The Quest","Arjuna's Celestial Weapons","Arjuna meditated to please Shiva, who appeared as a hunter and tested him. Pleased, Shiva gave him the Pashupata weapon.","trident bow mountains"],["Heaven","Indra's Court","In heaven Arjuna learned music and dance and gained divine weapons. The celestial dancer Urvashi cursed him when he declined her love.","lotus stars"],["The Test","The Yaksha's Questions","By a lake, a yaksha challenged Yudhishthira with riddles. His wise answers revived his brothers, who had died drinking the water.","sage waves"],["The Gift","Karna's Armour","Indra, disguised as a Brahmin, begged for Karna's natural armour and earrings. Karna gave them, knowing the cost, because he never refused a request.","shield sunburst"],["Hidden","The Year in Virata's Court","Yudhishthira, Bhima, Arjuna, the twins and Draupadi served King Virata in disguise. Bhima killed Kichaka, who had insulted Draupadi.","crown people"],["The Return","The Pandavas Are Found","Just as the thirteenth year ended, Arjuna defeated the Kaurava army to save Virata's cattle. Their true identity was revealed, too late for Duryodhana.","bow chariot"],["The Envoy","Krishna's Peace Mission","Krishna asked for just five villages for the Pandavas. Duryodhana refused even as much land as a needle's point could cover.","road flute"],["The Vision","The Universal Form","When Duryodhana tried to arrest him, Krishna revealed his cosmic form, holding gods, worlds and time itself.","sunburst eye"],["The Mother","Kunti Meets Karna","Kunti told Karna that he was her eldest son. He would not leave Duryodhana, but promised to spare four of the Pandavas.","heart waves"],["The Choice","Krishna's Offer","Krishna offered Duryodhana his whole army, or himself alone and unarmed. Duryodhana took the army; Arjuna chose Krishna.","chariot horse"],["The Armies","Eighteen Akshauhinis","Kings across India chose sides and gathered on the plains of Kurukshetra. The largest war of the ancient world was ready to begin.","tent elephant"],["The Rules","Laws of War","Both sides agreed rules: no fighting at night, no attacking the unarmed, none on those who flee. They were broken one by one.","scales"],["The Doubt","Arjuna Lays Down His Bow","Seeing teachers and kinsmen across the field, Arjuna let his bow slip from his hand. 'How can I fight those I love?' he asked.","bow chariot"],["The Song","The Bhagavad Gita","Krishna taught: do your duty without attachment to its reward. Those 700 verses became one of the world's great scriptures.","chakra book"],["Days 1 – 10","Bhishma on a Bed of Arrows","Invincible Bhishma fell when Arjuna shot through Shikhandi's shield. He lay on the arrows until he chose the day of his death.","arrows sun"],["Days 11 – 15","The Fall of Drona","Hearing that 'Ashwatthama is dead', the teacher laid down his weapons and was slain. Only an elephant of that name had been killed.","elephant sword"],["Day 13","Abhimanyu in the Wheel","Arjuna's young son entered the Chakravyuha formation but did not know the way out. Six warriors surrounded and killed him.","chakra sword"],["Days 16 – 17","Karna's Chariot Wheel","Karna's wheel sank into the earth and his memory of a mighty mantra failed him. Arjuna's arrow struck him down.","wheel bow"],["Day 18","Duryodhana's Fall","Bhima broke Duryodhana's thigh with his mace, fulfilling his vow. The Kaurava king lay dying beside a lake.","mace crown"],["The Night","The Night Raid","Ashwatthama killed the sleeping Pandava camp in revenge. Krishna cursed him to wander alone for three thousand years.","fire moon tent"],["Grief","Gandhari's Curse","Gandhari lost all her sons. She cursed Krishna that his clan, too, would perish, and he accepted it calmly.","candle eye"],["The Crown","Yudhishthira Rules","Hollow with grief, Yudhishthira was crowned. Bhishma taught him the duties of a king from his bed of arrows.","throne crown"],["The End","The Great Journey","After thirty-six years the Pandavas gave up the throne and walked north toward the Himalayas. One by one they fell, until only Yudhishthira and a faithful dog remained.","peak feet stars"],["The Message","What the Epic Teaches","'What is here is found elsewhere; what is not here is found nowhere.' The Mahabharata holds every human struggle, and invites us to choose dharma.","lotus book sun"]]},Gm={id:"ramayana",title:`The
Ramayana`,sub:"The Journey of Rama",blurb:"Exile, abduction, a bridge across the sea, and the homecoming of light.",cloth:"#1f5c52",gold:"#efcf7e",ink:"#1e2b27",pal:["#3f9a7a","#e5963a","#d9647f","#4e8fb5","#c9b23f"],emblem:"bow",parts:[[1,"Ayodhya Begins"],[11,"The Banishment"],[20,"The Forest"],[28,"Kishkindha"],[34,"Sundara Kanda"],[39,"The Great War"],[46,"Homecoming"]],pages:[["Prologue","Valmiki's Song","The sage Valmiki, moved by sorrow at a hunter's arrow, found himself speaking in verse. So was born the first poem, the Ramayana.","book sun"],["Ayodhya","The City of Kosala","On the banks of the Sarayu lay Ayodhya, a city of broad roads, gardens and justice, ruled by the wise King Dasharatha.","fort waves"],["Longing","A King Without an Heir","Dasharatha had three queens and no sons. On the advice of sage Rishyashringa he held a great fire sacrifice, and a divine bowl of sweet payasam rose from the flames.","fire chalice"],["Birth","Four Princes","Kausalya bore Rama, Kaikeyi bore Bharata, and Sumitra bore the twins Lakshmana and Shatrughna. Ayodhya rejoiced for days.","lotus sun"],["Youth","Rama and Lakshmana","Rama and Lakshmana grew inseparable, as did Bharata and Shatrughna. Rama was gentle, brave and humble beyond his years.","bow people"],["Guardians","Vishwamitra's Request","Sage Vishwamitra asked for Rama's help to protect his rituals from demons. The boys followed him into the forest.","sage forest"],["The Trial","Tataka Falls","Rama hesitated to strike a woman, but the sage reminded him of a prince's duty to protect the innocent. The demon Tataka fell.","bow forest"],["Mithila","King Janaka's Garden","In Mithila, Rama first saw Sita, found in a furrow of the earth by King Janaka. Their eyes met and neither forgot.","lotus sun"],["The Bow","Shiva's Bow Breaks","Only he who could lift and string Shiva's giant bow could wed Sita. Rama drew it, and it snapped with a thunderclap.","bow sunburst"],["The Wedding","Four Weddings","Rama wed Sita, Lakshmana wed Urmila, and Bharata and Shatrughna wed Mandavi and Shrutakirti. Mithila glowed with lamps.","diya mandala"],["The Plan","Rama to Be Crowned","Dasharatha, growing old, announced that Rama would be king. All Ayodhya decorated its streets in joy.","crown fort"],["The Whisper","Manthara's Poison","Kaikeyi's maid convinced her that Rama's coronation would harm Bharata. Fear and ambition clouded the queen's love.","eye moon"],["The Boons","Two Promises Recalled","Kaikeyi demanded the two boons once promised by the king: Bharata as king, and Rama exiled for fourteen years.","scroll crown"],["Duty","Rama Accepts","Rama smiled, touched his father's feet and left the palace barefoot. 'A word given must be kept,' he said.","feet road sun"],["Companions","Sita and Lakshmana Follow","Sita refused to stay behind, for a wife's place was beside her husband. Lakshmana, who could not be parted from Rama, followed too.","people road"],["Grief","A King's Broken Heart","Dasharatha sank into sorrow and died calling Rama's name. Ayodhya fell silent.","candle moon"],["The Return","Bharata Refuses the Crown","Bharata came home to find his father gone and his brother exiled. He rejected his mother's bargain and set out to find Rama.","chariot road"],["The Sandals","The Padukas","Rama would not return before his vow was done. Bharata carried home Rama's sandals and placed them on the throne.","sandals throne"],["Chitrakoot","A Hut of Leaves","Rama, Sita and Lakshmana built a hut of leaves and lived simply among sages, deer and peacocks.","hut deer forest"],["The Forest","Through Dandaka","Deeper in the wilderness, sages asked Rama to protect them from the rakshasas. He promised that no one would be afraid again.","forest bow"],["A Friend","Jatayu, King of Vultures","The great vulture Jatayu, a friend of Dasharatha, offered to watch over Sita. The forest family grew.","bird sun"],["Panchavati","The Hut by the Godavari","On the banks of the Godavari they built a leaf hut at Panchavati. For years they lived in peace.","hut waves palm"],["Shurpanakha","A Demon Princess","Ravana's sister Shurpanakha fell for Rama, then raged when rejected. Lakshmana cut off her nose in defence of Sita.","tiger moon"],["Deceit","The Golden Deer","Ravana's uncle Maricha took the form of a glittering deer. Sita begged Rama to fetch it, and he followed it into the woods.","deer sun"],["The Line","The Lakshmana Rekha","Hearing Rama's voice cry out, Sita sent Lakshmana to help. He drew a circle around the hut and told her never to cross it.","mandala hut"],["Abduction","Ravana Carries Sita Away","Ravana came as a holy man. When Sita stepped out to give alms, he seized her and flew south in his chariot.","chariot moon clouds"],["Sacrifice","Jatayu's Last Fight","Though old, Jatayu fought Ravana and fell wounded. He lived long enough to tell Rama which way Sita had been taken.","bird sword"],["The Search","Rama's Despair","Rama and Lakshmana wandered the forest asking trees, rivers and animals for Sita. Grief and determination grew together.","heart forest"],["Devotion","Shabari's Berries","The old woman Shabari tasted each berry to be sure it was sweet for Rama. He accepted them with love, for devotion matters most.","tree drop"],["The Meeting","Hanuman Meets Rama","Disguised as a Brahmin, Hanuman met the brothers near Mount Rishyamukha. Rama's gentle speech won his devotion for ever.","mace mountains"],["The Alliance","Sugriva's Bargain","Rama promised to help Sugriva regain his kingdom, and Sugriva promised to send the vanara armies to find Sita.","crown mountains"],["The Duel","Vali Falls","Rama shot from hiding and felled Vali in single combat with Sugriva. Dying, Vali asked if it was justice, and Rama answered him.","arrows forest"],["The Shore","Sampati's Sight","The vulture Sampati, Jatayu's brother, saw Lanka across the sea. But who could leap a hundred yojanas of ocean?","bird waves"],["The Leap","Hanuman Remembers His Strength","Reminded of his own powers, Hanuman grew mountain-tall and leapt across the ocean, overcoming every obstacle in his path.","mace waves sun"],["Lanka","The Golden City","Hanuman shrank to the size of a cat and entered Lanka's gleaming palaces, searching for Sita in every room.","dome moon"],["Ashoka Grove","Sita Under the Tree","Sita sat beneath a tree, thin and steadfast, refusing all of Ravana's offers. Hanuman gave her Rama's ring and was moved to tears.","tree moon"],["Fire","Lanka Burns","Ravana's men set Hanuman's tail alight. He leapt across the rooftops, and the golden city burned behind him.","fire fort"],["The Report","'I Have Seen Sita'","Hanuman returned with Sita's jewel. Rama embraced him and said he had nothing to give but his heart.","diamond heart mountains"],["The Bridge","Crossing the Sea","Rama prayed to the ocean for three days, then raised his bow. The sea god appeared and showed a way: Nala would build a bridge.","bridge waves"],["The Stones","Rama Setu Rises","The vanaras wrote Rama's name on boulders, and the stones floated. In five days a causeway spanned the sea to Lanka.","bridge palm sun"],["The Brother","Vibhishana Joins Rama","Ravana's righteous brother warned him to return Sita, was insulted, and came to Rama for shelter. Rama welcomed him as a friend.","crown lotus"],["The Battle","The Armies Meet","Bears, monkeys and rakshasas clashed outside Lanka's gates. Nights blazed with magic weapons, and the sky rained fire.","arrows fort fire"],["The Mountain","Hanuman and the Sanjeevani","Lakshmana lay dying. Hanuman flew to the Himalayas for a healing herb, and when he could not tell which it was, he lifted the whole mountain.","peak mace sun"],["The Duel","Ravana's Ten Heads","Every time Rama cut off one of Ravana's ten heads, another grew back, until he fired the Brahmastra at his heart.","crown bow"],["Victory","Dawn After the War","Ravana fell, and Lanka was given to the righteous Vibhishana. Rama had kept his promise.","sunburst crown"],["The Trial","Sita's Trial by Fire","To prove her purity before all, Sita stepped into a blazing pyre. Agni, the fire god, lifted her out unharmed and declared her blameless.","fire lotus"],["The Flight","The Pushpaka Vimana","Rama, Sita, Lakshmana and their friends returned in Ravana's flying chariot, pointing out the rivers and forests of their exile.","chariot clouds sun"],["The Reunion","Bharata's Joy","Fourteen years to the day, Bharata met his brother at Nandigram and carried Rama's sandals back to his feet.","sandals heart"],["The Light","Diwali: A City of Lamps","Ayodhya lit rows of clay lamps to welcome its king home. That night of lights is still celebrated as Diwali.","diya stars"],["The Coronation","Rama Rajya","Rama was crowned king. His reign, Rama Rajya, is remembered as a time of justice, peace and prosperity.","crown throne sun"],["The Shadow","Sita's Later Years","Rumours led Rama to send Sita away. She lived in Valmiki's hermitage and raised twin sons, Lava and Kusha. The epic does not flinch from pain.","hut lotus moon"],["The Legacy","The Story Travels","From Thailand's Ramakien to Indonesian shadow plays, Cambodia's Reamker and village Ram Lilas across India, the story keeps being retold.","globe lotus stars"]]},Ym={id:"jesus",title:`The Story
of Jesus`,sub:"From Bethlehem to the Empty Tomb",blurb:"A carpenter’s son, a message of love, and a story that changed the world.",cloth:"#2c3e63",gold:"#ecd596",ink:"#27303f",pal:["#c9a66b","#5d84ab","#8e9a5b","#e3c774","#a9745a"],emblem:"bethlehem",parts:[[1,"A World Waiting"],[8,"Birth and Childhood"],[16,"The Ministry Begins"],[24,"Stories and Teachings"],[34,"Miracles and Mercy"],[41,"Jerusalem"],[48,"Resurrection and Legacy"]],pages:[["Prologue","The Story of Jesus of Nazareth","Born in a small Roman province, Jesus became the central figure of Christianity and one of history's most influential teachers. This is his story as the Gospels tell it.","sunburst book"],["The Setting","Judea Under Rome","Around 4 BC, Judea was ruled by Herod the Great under Roman authority. The people yearned for a promised Messiah.","fort hills sun"],["The Promise","The Prophets' Hope","Isaiah and other prophets had spoken of a coming child called Wonderful Counsellor and Prince of Peace.","scroll stars"],["The Visit","Gabriel and Mary","In Nazareth a young woman named Mary was told she would bear a son, to be named Jesus. 'Let it be done to me,' she said.","dove stars"],["The Dream","Joseph's Decision","Joseph, a carpenter betrothed to Mary, was troubled, until an angel in a dream told him to take her as his wife.","hut moon stars"],["The Journey","Mary and Elizabeth","Mary travelled to the hill country to visit her cousin Elizabeth, who would bear John. Elizabeth's child leapt in her womb.","hills heart"],["The Road","To Bethlehem","A census ordered by Caesar Augustus sent Joseph and Mary ninety miles south to Joseph's ancestral town.","road moon stars"],["The Night","Born in a Stable","With no room at the inn, Mary gave birth in a stable and laid her baby in a manger.","stable stars"],["The Shepherds","Angels Over the Fields","Shepherds watching their flocks were told of a saviour born that night. They hurried to see the child.","staff hills stars"],["The Star","The Magi Follow the Star","Wise men from the East followed a new star, bringing gifts of gold, frankincense and myrrh.","bethlehem camel"],["The Flight","Escape to Egypt","Warned of Herod's jealousy, Joseph took Mary and Jesus by night to Egypt. They stayed until Herod died.","camel moon stars"],["Home","Growing Up in Nazareth","Jesus grew up in a village of a few houses, learning the Scriptures and Joseph's carpentry.","hut tree"],["The Temple","The Boy in the Temple","At twelve, Jesus stayed behind in Jerusalem to talk with the teachers. His parents found him after three days: 'I must be in my Father's house.'","dome scroll"],["The Silence","The Hidden Years","The Gospels say little of the next eighteen years. He worked, prayed and grew in wisdom.","hourglass tree"],["The Forerunner","John in the Wilderness","John called the people to repent and be washed in the River Jordan. He wore camel hair and ate locusts and wild honey.","sage waves"],["The Baptism","The Dove Descends","Jesus was baptised by John in the Jordan. The heavens opened, a dove descended, and a voice said, 'This is my beloved Son.'","dove waves rays"],["The Desert","Forty Days of Testing","Jesus fasted in the wilderness, refusing the temptations of bread, power and glory.","peak moon"],["The Call","Fishermen Become Followers","By the Sea of Galilee, Jesus called Simon Peter, Andrew, James and John. 'Follow me, and I will make you fishers of people.'","boat fish waves"],["The Twelve","The Disciples","He chose twelve companions, ordinary men: fishermen, a tax collector, a zealot. They left their nets and lived on the road.","people road"],["The Sign","Water into Wine at Cana","At a wedding feast the wine ran out. Jesus asked the servants to fill jars with water, and it became wine, his first sign.","chalice drop"],["The Sermon","The Sermon on the Mount","On a hillside he taught: 'Blessed are the poor in spirit, the meek, the merciful, the peacemakers.' His words turned the world upside down.","sage hills sun"],["The Prayer","Our Father","When his disciples asked how to pray, he gave them a short prayer beginning, 'Our Father, who art in heaven.'","heart rays"],["The Rule","The Golden Rule","'Do to others as you would have them do to you.' Many traditions share this idea; he made it the heart of the law.","heart scales"],["The Parable","The Good Samaritan","A traveller was robbed and left on the road. Priests passed by, but a Samaritan, an outsider, stopped to help him. 'Go and do likewise.'","road people"],["The Parable","The Prodigal Son","A young man squandered his inheritance, then returned home in shame. His father ran to embrace him.","hut road heart"],["The Parable","The Lost Sheep","A shepherd left ninety-nine to find the one that strayed. Heaven rejoices more over one who returns.","staff hills"],["The Parable","The Sower","Some seed fell on the path, some on rock, some among thorns, but some on good soil and bore a hundredfold.","wheat hills sun"],["The Parable","The Mustard Seed","The kingdom of heaven is like a tiny seed that grows into a great tree where the birds find shelter.","tree bird"],["The Parable","Wise and Foolish Builders","One man built his house on rock, another on sand. When the storm came, only the first house stood.","hut clouds"],["The Parable","The Talents","A master entrusted coins to three servants. Two multiplied theirs; one buried his out of fear.","scales medal"],["The Teaching","Consider the Lilies","'Do not worry about tomorrow. Look at the birds of the air and the flowers of the field; your Father feeds them.'","lotus bird"],["The Teaching","Love Your Enemies","'Love your enemies and pray for those who persecute you.' It was a radical call to break the cycle of revenge.","heart olive"],["The Teaching","The Greatest Commandment","Asked which law was greatest, Jesus said: love God with all your heart, and love your neighbour as yourself.","heart scroll"],["The Healing","The Paralysed Man","Four friends lowered a paralysed man through a roof to reach Jesus. 'Rise, take up your mat, and walk.'","hut people"],["The Calm","Stilling the Storm","A squall threatened the fishing boat while Jesus slept. 'Peace, be still,' he said, and the wind dropped.","boat clouds waves"],["The Feast","Feeding the Five Thousand","Five loaves and two fish, shared among a hungry crowd, left twelve baskets of scraps.","loaf fish hills"],["The Lake","Walking on Water","In the fourth watch of the night he came to his frightened disciples, walking on the lake. Peter stepped out too, then began to sink.","waves moon feet"],["The Sight","Bartimaeus Sees","A blind beggar by the road cried out for mercy. Jesus asked what he wanted: 'Lord, let me see.' And he did.","eye sun"],["The Outcast","Touching the Untouchable","Jesus touched lepers and ate with tax collectors and sinners, welcoming those society turned away.","people heart"],["The Friend","Raising Lazarus","Jesus wept at the tomb of his friend Lazarus. Then he called, 'Lazarus, come out!' and the dead man walked free.","tomb sun"],["The Entry","Palm Sunday","Crowds spread cloaks and palm branches as Jesus rode into Jerusalem on a donkey, calling 'Hosanna!'","palm horse"],["The Anger","Cleansing the Temple","He overturned the tables of the money-changers: 'My house shall be called a house of prayer.' The authorities began to plot.","dome fire"],["The Supper","The Last Supper","On the night before his arrest he broke bread with his disciples, washed their feet and told them to love one another.","chalice loaf"],["The Garden","Gethsemane","Under the olive trees he prayed in anguish. The disciples slept. Then Judas came with soldiers.","olive moon stars"],["The Trial","Before Pilate","Condemned by the council, Jesus was brought to the Roman governor Pontius Pilate, who found no fault but gave way to the crowd.","throne scroll"],["The Mockery","The Crown of Thorns","Soldiers mocked him as king with a robe, a reed and a crown of thorns.","thorns"],["Golgotha","The Crucifixion","On a hill outside the city he was crucified between two criminals. 'Father, forgive them,' he said. 'It is finished.'","cross hills clouds"],["The Silence","The Tomb Is Sealed","Joseph of Arimathea laid him in a new tomb, and a great stone was rolled across the entrance.","tomb moon stars"],["The Dawn","The Empty Tomb","On the first day of the week the women found the stone rolled away. 'He is not here; he has risen.'","tomb sunburst"],["The Road","Walking to Emmaus","Two travellers met a stranger on the road and recognised him only when he broke bread.","road loaf sun"],["The Commission","Go and Make Disciples","Before ascending, Jesus sent his followers to all nations: 'I am with you always.' At Pentecost they were filled with courage.","dove fire globe"],["The Legacy","Two Thousand Years On","From a handful of fishermen, Christianity grew to over two billion followers, inspiring art, hospitals, schools and acts of mercy worldwide.","cross globe stars"]]},Zm={id:"technology",title:`Evolution
of Technology`,sub:"From Stone to Silicon",blurb:"Curiosity solving problems: the long road from a sharpened stone to artificial minds.",cloth:"#8f4a27",gold:"#f0d08a",ink:"#2a2521",pal:["#2f8f9a","#c96f3c","#4b5fb0","#e3b23c","#7a8793"],emblem:"gears",parts:[[1,"First Tools"],[9,"Ancient Ingenuity"],[17,"Knowledge and Exploration"],[25,"The Age of Machines"],[34,"Atoms and Electrons"],[42,"The Digital World"],[49,"Now and Tomorrow"]],pages:[["Prologue","How Humans Invented the World","From a sharpened stone to a pocket supercomputer, technology is the story of curiosity solving problems. Turn the pages to travel from the first spark to the age of AI.","bulb stars"],["3.3 million years ago","The First Stone Tools","Early hominins struck stones to make sharp flakes for cutting meat and plants. It was the start of a long partnership between hands and minds.","handaxe feet"],["~1 million years ago","Taming Fire","Fire gave warmth, protection and cooked food. Gathered around the flame, people shared stories and grew larger brains.","fire moon stars"],["~40,000 BCE","Needles, Flutes and Art","Bone needles sewed warm clothing, bone flutes made music, and cave walls filled with painted animals. Technology and imagination grew together.","flute deer"],["~10,000 BCE","Farming Begins","In the Fertile Crescent people planted wheat and barley and tamed animals. Villages replaced wandering camps.","wheat sun hills"],["~8000 BCE","Clay and Pottery","Fired clay pots stored grain, water and oil. Later the same kilns would smelt metal.","spice fire"],["~3500 BCE","The Wheel","Potters' wheels in Mesopotamia became cart wheels. Suddenly loads could roll across the land.","wheel ground"],["~3300 BCE","The Bronze Age","Mixing copper and tin made bronze: tools, weapons and bells stronger than stone. Whole civilisations were named for a metal.","sword shield"],["~3200 BCE","Writing","The Sumerians pressed wedge-shaped marks into clay. Records, laws and poems could now outlive their authors.","scroll"],["~2600 BCE","Pyramids and Engineering","Egyptians moved two-million-block monuments using ramps, levers and organised labour. Mathematics built mountains.","pyramid sun"],["~2500 BCE","Indus Valley Cities","Harappa and Mohenjo-daro had grid streets, brick houses and covered drains: urban planning 4,500 years ago.","fort waves"],["~1200 BCE","The Iron Age","Iron was harder to smelt than bronze, but its ore lay everywhere. Stronger ploughs and tools spread widely.","sword fire"],["~250 BCE","Archimedes: Screws and Levers","Archimedes lifted water with a turning screw and claimed that a long enough lever could move the world.","gears drop"],["~100 BCE","The Antikythera Mechanism","A bronze device of dozens of gears, found in a shipwreck, predicted eclipses and planetary positions. It is the earliest known analogue computer.","gears moon stars"],["~100 CE","Paper and Printing in China","Cai Lun refined paper; later, woodblock printing carried words farther. China also gave the world the compass and gunpowder.","scroll book"],["~500 CE","Zero and Decimals","Indian mathematicians treated zero as a number and wrote tens with place value. The idea reached Arab scholars and then Europe, making modern mathematics possible.","abacus sunburst"],["~800 CE","The House of Wisdom","In Baghdad, scholars translated and improved Greek, Indian and Persian knowledge. Algebra, optics and medicine flourished.","dome book"],["1000s","Compass and Navigation","Magnetic needles and astrolabes helped sailors cross open seas far from shore.","ship stars waves"],["1440","Gutenberg's Printing Press","Movable metal type and a wine-press made books cheap. Literacy spread, and ideas travelled like never before.","book gears"],["1543 – 1610","The Telescope Opens the Sky","Copernicus moved the Earth; Galileo's telescope found moons orbiting Jupiter. Humanity's place in the cosmos changed for ever.","telescope moon stars"],["1600s","Microscopes and Tiny Worlds","Leeuwenhoek saw bacteria, and Hooke drew cells. A hidden universe of life became visible.","microscope drop"],["1687","Newton's Laws","Isaac Newton explained falling apples and orbiting planets with the same mathematics. Science became a tool for prediction.","globe stars"],["1712 – 1781","Steam Gains Power","Newcomen's pump and Watt's improved engine turned fuel into motion. Factories and mines no longer needed rivers or muscle.","gears smoke"],["1764","Spinning Jenny and Power Looms","Machines spun many threads at once, and cloth poured out of factories. The Industrial Revolution began in Britain.","gears diamond"],["1804","The Railway","Trevithick, then Stephenson, put steam engines on rails. Journeys that took days took hours, and continents were stitched together.","train smoke"],["1807","Steamships","Fulton's paddle steamer and later iron hulls with propellers shortened oceans and moved millions of migrants and tonnes of goods.","ship smoke waves"],["1837 – 1844","The Telegraph","Morse code sent words along wires in seconds. News stopped travelling at the speed of a horse.","pole letter"],["1839","Photography","Daguerre and Talbot fixed images onto plates and paper. The world could now be captured in a moment.","camera sun"],["1876","The Telephone","Alexander Graham Bell's 'Mr Watson, come here' was the first sentence carried by voice along a wire.","phone pole"],["1879","Edison's Light Bulb","After thousands of trials, a carbonised filament glowed for hours. Cities began to shine after dark.","bulb rays"],["1885 – 1908","The Automobile","Karl Benz built a three-wheeled motorwagen; Henry Ford's assembly line made cars affordable to ordinary families.","car road"],["1903","The Wright Brothers Fly","At Kitty Hawk, Orville flew for twelve seconds. Within sixty-six years, humans would walk on the Moon.","plane clouds sun"],["1895 – 1901","Radio Waves","Marconi sent signals across the Atlantic without wires. Broadcasting would bring one voice to millions.","radio stars"],["1928","Penicillin","Alexander Fleming noticed mould killing bacteria in a dish. Antibiotics went on to save hundreds of millions of lives.","microscope drop"],["1936 – 1946","The First Computers","Turing imagined a universal machine; the giant ENIAC filled a room and computed artillery tables in seconds.","computer gears"],["1942 – 1954","Nuclear Power","Splitting the atom released enormous energy, used first in weapons and then in reactors that light whole cities.","gears sunburst"],["1947","The Transistor","Bell Labs' tiny switch replaced bulky vacuum tubes. Every modern electronic device is built from billions of transistors.","chip"],["1957","Sputnik","The Soviet Union launched the first artificial satellite. The space race began, and with it a flood of new technologies.","satellite stars"],["1961 – 1969","To the Moon","Yuri Gagarin orbited Earth in 1961; Neil Armstrong and Buzz Aldrin walked on the Moon in 1969. 'One giant leap for mankind.'","rocket moon stars"],["1969","ARPANET","Four university computers exchanged a message: 'LO', the start of 'LOGIN', before the system crashed. It was the first step of the internet.","globe wire"],["1971 – 1977","Microprocessors and Home Computers","An entire computer on one chip led to hobbyist kits, then Apple and Microsoft. Computers left the labs and arrived on desks.","chip computer"],["1983 – 1991","The Internet and the Web","TCP/IP joined networks together, and Tim Berners-Lee invented the World Wide Web at CERN. Anyone could publish to the world.","globe cloud"],["1990s","Mobile Phones","Handsets shrank from bricks to pocket devices. Text messages and then apps changed how people connect.","phone"],["1998 – 2006","Search and Social","Google organised the web's information; Facebook, YouTube and Twitter made everyone a publisher and an audience.","eye globe"],["2007","The Smartphone","The iPhone and Android put a computer, camera, map and music player in every pocket.","phone camera"],["1990 – 2003","Decoding the Genome","The Human Genome Project mapped three billion letters of DNA, opening the door to personalised medicine and gene editing.","dna"],["2006 – 2020","Cloud and Big Data","Computing moved into vast data centres you can rent by the second. Streaming, maps and collaboration follow you everywhere.","cloud chip"],["2010s","Renewable Energy","Solar panels and wind turbines became cheaper than coal in many places, offering a way to power life without warming the planet.","solar sun"],["2012 onward","Machine Learning","Neural networks learned to recognise images, translate languages and play Go at champion level, trained on vast amounts of data.","eye chip"],["2020s","Generative AI","Systems that write, draw and code became everyday tools, raising hopes for creativity and hard questions about truth, work and ethics.","computer book stars"],["Ahead","Space, Quantum and Robots","Reusable rockets, quantum computers and robots hint at the next chapters. The limits are as much human as technical.","rocket satellite stars"],["Reflection","Tools Reflect Their Makers","Every invention from stone axe to algorithm reflects the values of the people who build and use it. The next page is yours to write.","bulb handaxe stars"]]},qm={id:"india",title:`Incredible
India`,sub:"Diversity & Richness",blurb:"Mountains, monsoons, a hundred tongues and every festival under the sun.",cloth:"#a4245a",gold:"#f5d680",ink:"#2f1f27",pal:["#f08a24","#2f9a6a","#d9326f","#2f8fb0","#e8c02e"],emblem:"mandala",parts:[[1,"The Land"],[10,"The People"],[19,"Arts and Crafts"],[28,"Food and Festivals"],[38,"Wisdom and Ingenuity"],[46,"One Nation"]],pages:[["Prologue","A Civilisation of Civilisations","One country, 28 states, 22 official languages, thousands of dialects and every major faith. Its diversity is not a problem to solve but a treasure to celebrate.","mandala sun"],["North","The Himalayas","Rising in the north, the world's youngest great mountain range feeds rivers, shelters monasteries and frames India's story.","peak stars"],["The Plains","The Indo-Gangetic Plain","The Ganga and Yamuna carry silt across fertile land that feeds hundreds of millions. Cities like Varanasi have been inhabited for thousands of years.","temple waves sun"],["West","The Thar Desert","Golden dunes, camel caravans and the forts of Rajasthan. Women's colourful dress stands out against the sand.","camel fort sun"],["South","Peninsula and Western Ghats","Monsoon forests, tea and spice hills. Kerala's backwaters and Karnataka's coffee estates flourish here.","palm tea hills"],["East","The Brahmaputra and the Northeast","Seven sister states, each with its own tribes, music and crafts. The Brahmaputra floods and nourishes Assam's tea gardens.","tiger forest waves"],["The Coast","Seven Thousand Kilometres of Shore","Fishing villages, ancient ports and golden beaches ring the peninsula from Gujarat to Bengal. Trade with Rome, Arabia and China began here.","ship waves palm"],["Seasons","The Monsoon","Every June, rain-bearing winds arrive from the Arabian Sea. The monsoon decides harvests, poems and festivals.","clouds drop"],["Wildlife","Tigers, Elephants and Peacocks","India shelters Bengal tigers, Asian elephants, one-horned rhinos, snow leopards and the graceful national bird, the peacock.","tiger elephant peacock"],["Ancient Roots","Indus Valley to the Mauryas","From Harappa's cities to Ashoka's edicts carved in stone, the subcontinent has been home to great civilisations.","chakra fort"],["Kingdoms","Empires of the South","The Cholas sailed to Southeast Asia, the Vijayanagara empire built Hampi, and Pallava sculptors carved temples from rock.","temple ship waves"],["The Mughals","Domes and Gardens","The Mughals blended Persian and Indian styles in forts, gardens and the Taj Mahal, built by Shah Jahan in memory of Mumtaz Mahal.","dome moon stars"],["Faiths","Many Paths to the Divine","Hinduism, Buddhism, Jainism and Sikhism were born here. Islam, Christianity, Judaism and Zoroastrianism found warm homes too.","lotus crescent cross"],["Languages","A Country of Many Tongues","Hindi, Bengali, Tamil, Telugu, Marathi, Urdu, Kannada, Malayalam, Odia, Punjabi and many more. Some literary traditions are over 2,000 years old.","book scroll"],["Cities","Mumbai, Delhi, Kolkata, Chennai","Each metropolis has its own rhythm: Mumbai's hustle, Delhi's history, Kolkata's literature and Chennai's classical culture.","skyline sun"],["Villages","The Heart of India","Nearly two-thirds of Indians live in villages, where festivals, fairs, weaving and farming shape the year.","hut wheat sun"],["Tribes","The Adivasi Heritage","From the Gonds and Santhals to the Nagas and Bhils, indigenous communities hold ancient songs, art and forest knowledge.","tree tabla"],["The Soul of India","Hospitality","Atithi Devo Bhava: the guest is God. A traveller in any village may be offered tea, a meal and a place to sit.","tea heart"],["Dance","Bharatanatyam and Kathak","Eight classical dance forms tell stories with mudras, rhythm and expression. Bharatanatyam came from Tamil temples, Kathak from the courts of the north.","tabla lotus"],["Dance","Kathakali, Odissi and Garba","Kerala's Kathakali paints faces in vivid green and red; Odissi curves like temple sculpture; Gujarat dances Garba all night.","mandala diya"],["Music","Raga: Music of the Hours","Hindustani and Carnatic traditions use ragas, each suited to a time of day or season. Sitar, sarod, veena and tabla weave the sound.","veena tabla"],["Folk Art","Madhubani, Warli, Pattachitra","Village art from Bihar's walls, Maharashtra's huts and Odisha's scrolls uses natural colours and geometric patterns.","peacock mandala"],["Textiles","A Thousand Weaves","Banarasi silk, Kanjeevaram sarees, Bandhani tie-dye, Kashmiri shawls and Khadi all come from skilled hands.","diamond"],["Architecture","Temples in Stone","Khajuraho, Konark, Meenakshi and Hampi show how each region imagined the sacred in stone.","temple sun"],["Cinema","From Bollywood to Kollywood","India makes more films than any other nation, in dozens of languages. Songs, dance and drama weave together.","camera stars"],["Literature","From Kalidasa to Tagore","Sanskrit epics, Sangam poetry, Bhakti verses and modern novels. Tagore became Asia's first Nobel laureate in literature, in 1913.","book feather"],["Games","Chess, Kabaddi and Cricket","Chess began as chaturanga here; kabaddi and kho-kho are home-grown, and cricket is a national passion.","cricket sun"],["Spices","Spices of the World","Pepper from Kerala, saffron from Kashmir, turmeric, cardamom and cloves: spices that once drew ships across oceans.","spice ship"],["On the Plate","North and South","Naan, dal and paneer in the north; dosa, idli and sambar in the south. Fish curry in Bengal, dhokla in Gujarat and vada pav in Mumbai.","spice tea"],["Chai","Tea on Every Corner","Whether Darjeeling, Assam or roadside masala chai, tea brings neighbours and strangers together.","tea clouds"],["Diwali","The Festival of Lights","Rows of diyas, rangoli and fireworks celebrate light over darkness, and Rama's homecoming.","diya stars"],["Holi","Colours of Spring","People throw coloured powder, dance and forgive old quarrels. Holi marks the end of winter and the triumph of good over evil.","mandala sun"],["Eid","Eid and Shared Feasts","After a month of Ramadan fasting, families enjoy sheer khurma and biryani in open houses where friends of every faith are welcome.","crescent dome stars"],["Christmas","Christmas and Easter in India","Goa's churches and Kerala's ancient Syrian Christian community celebrate with stars, carols and cake.","bethlehem palm"],["Onam","Kerala's Harvest Festival","Flower carpets, snake-boat races and a feast on banana leaves welcome the mythical king Mahabali.","boat lotus waves"],["Pongal","Harvest Thanks","Tamil Nadu boils new rice and milk until it overflows, thanking sun and cattle. Makar Sankranti, Lohri and Bihu share the season.","wheat sun"],["Gurpurab","Langar and Service","Sikh gurdwaras feed everyone, whatever their faith or caste, at free community kitchens. Guru Nanak's birthday is celebrated with hymns.","diya people"],["Wellbeing","Yoga and Ayurveda","Yoga's postures and breathing and Ayurveda's herbal medicine have been practised for thousands of years and are loved across the world.","sage lotus"],["Teachers","Buddha and Mahavira","Two teachers of non-violence and compassion lived in ancient Bihar. Their messages spread across Asia.","sage tree"],["Numbers","Mathematics and Astronomy","Aryabhata calculated pi and the Earth's rotation; Brahmagupta set rules for zero; Kerala's school found infinite series before Europe.","abacus stars"],["Science","Modern Science Leaders","C. V. Raman won the Nobel Prize for light scattering, Ramanujan astounded Cambridge, and Homi Bhabha built an atomic energy programme.","microscope bulb"],["Space","Chandrayaan and Mangalyaan","ISRO reached Mars on its first try for less than the cost of a Hollywood film, and landed near the Moon's south pole in 2023.","rocket moon stars"],["Rails","The Indian Railways","Begun in 1853, it is one of the world's largest networks, carrying over 20 million people a day through every landscape.","train hills sun"],["Digital","The Silicon Plateau and UPI","Bengaluru's tech industry and UPI instant payments show India's digital leap, with millions of small shops and phones connected.","phone chip"],["Green India","Sacred Groves and Solar Power","Communities protected sacred forests for centuries. Today India builds some of the largest solar parks in the world.","tree solar sun"],["Freedom","Independence, 1947","After a long non-violent struggle led by Gandhi, Nehru, Patel, Ambedkar, Bose, Sarojini Naidu and many more, India became free on 15 August 1947.","flag sun"],["The Constitution","We, the People","Dr B. R. Ambedkar's drafting committee wrote a constitution guaranteeing equality and freedom. It came into force on 26 January 1950.","book scales"],["Democracy","The World's Largest Election","Hundreds of millions of voters, and voting machines carried by boat, elephant and on foot to remote booths. Every vote counts.","people flag"],["Unity","Unity in Diversity","Different languages, colours and beliefs, yet one nation: the idea that shared humanity matters more than difference.","mandala people"],["Symbols","Tiranga and the Ashoka Chakra","The saffron, white and green flag carries a 24-spoke blue wheel, reminding citizens of dharma and progress.","flag chakra"],["Youth","A Young Nation","More than half of Indians are under thirty. Their ideas, start-ups, sports and art will shape the coming decades.","bulb stars"],["Invitation","Come and See for Yourself","Taste it, hear it, walk it: India is best understood by visiting with an open heart. Atithi Devo Bhava, the guest is God.","gate lotus sun"]]},Xm=[Um,km,Gm,Ym,Zm,qm];function Qm({story:M,index:H,onOpen:S}){return c.jsxs("button",{onClick:S,className:"group flex flex-col items-center gap-5 text-left outline-none","aria-label":`Open ${M.title.replace(`
